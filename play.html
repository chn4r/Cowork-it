<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Cowork it</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#26154d}#app{width:100%;height:100%;border:0}.safety{position:fixed;right:12px;bottom:82px;z-index:9999;border:0;border-radius:999px;padding:11px 14px;background:#26154d;color:#fff;box-shadow:0 6px 24px #0004;font:600 13px system-ui}.panel{display:none;position:fixed;inset:auto 12px 132px 12px;z-index:10000;background:#fff;color:#251a32;border-radius:18px;padding:16px;box-shadow:0 16px 60px #0006;font:14px/1.4 system-ui}.panel.open{display:block}.panel a,.panel button{display:block;width:100%;box-sizing:border-box;padding:10px;margin:5px 0;border:0;border-radius:10px;text-align:left;background:#f3eefb;color:#35204f;text-decoration:none;font:inherit}.panel .close{background:#26154d;color:white}.panel .danger{background:#ffe2df;color:#8e1b12}</style></head><body><iframe id="app" src="./index.html" allow="geolocation; clipboard-read; clipboard-write"></iframe><button class="safety" id="safetyBtn">Sécurité · Confidentialité</button><div class="panel" id="panel"><b>Cowork it — sécurité</b><a href="./community-guidelines.html">Règles de la communauté</a><a href="./privacy.html">Politique de confidentialité</a><a href="./terms.html">Conditions d'utilisation</a><a href="./safety.html">Signalement et blocage</a><a href="./delete-account.html">Demande de suppression web</a><button class="danger" id="deleteNow">Supprimer mon compte maintenant</button><button class="close" id="closePanel">Fermer</button></div><script>const base='https://xiodvkpdghqgybkktpuq.supabase.co/functions/v1/';const panel=document.getElementById('panel');safetyBtn.onclick=()=>panel.classList.toggle('open');closePanel.onclick=()=>panel.classList.remove('open');function logged(){let u=null;try{u=JSON.parse(sessionStorage.getItem('coworkit3_user')||'null')}catch{}return {u,token:sessionStorage.getItem('coworkit3_access_token')||''}}async function callFn(name,body){const {u,token}=logged();if(!u?.id||!token){alert('Connectez-vous à votre compte Cowork it pour cette action.');return null}return fetch(base+name,{method:'POST',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify(body||{})})}async function report(id){const reason=prompt('Motif du signalement : harcèlement, spam/fraude, contenu illégal, vie privée, autre');if(!reason)return;const r=await callFn('report-content',{content_type:'user',content_id:id,reason});if(r)alert(r.ok?'Signalement envoyé. Merci.':'Impossible d’envoyer le signalement.');}async function block(id,card){const set=new Set(JSON.parse(localStorage.getItem('coworkit_blocked')||'[]'));set.add(id);localStorage.setItem('coworkit_blocked',JSON.stringify([...set]));card?.remove();if(/^[0-9a-f]{8}-[0-9a-f-]{27}$/i.test(id))await callFn('block-user',{blocked_id:id}).catch(()=>null);alert('Utilisateur bloqué.');}deleteNow.onclick=async()=>{if(!confirm('Supprimer définitivement votre compte Cowork it et ses données associées ?'))return;const r=await callFn('delete-account',{});if(!r)return;if(r.ok){localStorage.clear();sessionStorage.clear();alert('Compte supprimé.');location.href='./privacy.html'}else alert('La suppression a échoué.');};function enhance(){const d=document.getElementById('app').contentDocument;if(!d)return;const blocked=new Set(JSON.parse(localStorage.getItem('coworkit_blocked')||'[]'));d.querySelectorAll('.person').forEach(card=>{const b=card.querySelector('[data-action="open-person"]');const id=b?.dataset.id;if(!id)return;if(blocked.has(id)){card.remove();return}if(card.querySelector('[data-cowork-safety]'))return;const box=d.createElement('div');box.dataset.coworkSafety='1';box.style.cssText='display:flex;gap:8px;margin-top:8px';const r=d.createElement('button');r.textContent='Signaler';r.className='secondary';r.onclick=e=>{e.preventDefault();e.stopPropagation();report(id)};const bl=d.createElement('button');bl.textContent='Bloquer';bl.className='secondary';bl.onclick=e=>{e.preventDefault();e.stopPropagation();if(confirm('Bloquer cet utilisateur ?'))block(id,card)};box.append(r,bl);card.append(box);});}document.getElementById('app').addEventListener('load',()=>{try{enhance();new MutationObserver(enhance).observe(document.getElementById('app').contentDocument.body,{childList:true,subtree:true})}catch(e){}});</script></body></html>
